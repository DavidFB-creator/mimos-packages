# El diario del sistema no puede crecer sin límite, pero tampoco puede ser
# tan pequeño que borre lo que hace falta para diagnosticar.
#
# Por defecto systemd usa hasta el 10% del disco, que en 500 GB son 50 GB de
# registros. CachyOS lo baja a 50 M, y eso aquí sería un error: se lleva por
# delante los arranques anteriores, y `mimos-diagnostico` vive precisamente
# de poder mirar el arranque en el que algo falló. ADR-121 se diagnosticó
# leyendo un volcado y su journal.
#
# 500 M mantiene varias semanas de arranques en cualquier máquina de uso
# normal y sigue siendo una fracción despreciable de un disco moderno.
[Journal]
SystemMaxUse=500M
