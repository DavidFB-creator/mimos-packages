# El diario del sistema no puede crecer sin límite, pero tampoco puede ser
# tan pequeño que borre lo que hace falta para diagnosticar.
#
# Por defecto systemd usa hasta el 10% del disco, que en 500 GB son 50 GB de
# registros. CachyOS lo baja a 50 M, y eso aquí sería un error: se lleva por
# delante los arranques anteriores, y `mimos-diagnostico` vive precisamente
# de poder mirar el arranque en el que algo falló. ADR-121 se diagnosticó
# leyendo un volcado y su journal.
#
# 500 M mantiene varias semanas de arranques en cualquier máquina de uso
# normal y sigue siendo una fracción despreciable de un disco moderno.
[Journal]
SystemMaxUse=500M

# Y el diario tiene que sobrevivir al reinicio, que es lo que todo lo de
# arriba daba por hecho (ADR-155). Archiso monta el suyo en RAM -- correcto
# para un medio Live -- con un fichero en /etc que Calamares copia al disco,
# donde gana a este por vivir en /etc. Resultado: en toda instalación de
# MimOS de la historia el journal se borraba entero en cada arranque, el
# límite de arriba reservaba medio giga de RAM en vez de disco, y
# `mimos-diagnostico` no podía enseñar jamás el arranque anterior -- que es
# el único que importa cuando algo obliga a reiniciar. Medido en el portátil
# de David el 2026-08-22: `journalctl --list-boots` recordaba un arranque, y
# el diario estaba en /run/log/journal.
#
# Explícito en vez de confiar en `auto`, que sólo persiste si el directorio
# ya existe: así la intención está escrita y no depende de un accidente del
# sistema de ficheros.
Storage=persistent
