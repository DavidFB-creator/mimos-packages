# Apagar no debe parecer que el ordenador se ha colgado.
#
# systemd espera 90 segundos por defecto a que un servicio termine antes de
# matarlo. Cuando uno se atasca, la persona se queda mirando una pantalla
# negra minuto y medio pensando que su MimOS está roto, y aprende a apagar
# con el botón — que sí rompe cosas.
#
# 20 segundos, no los 10 que usa CachyOS: el beneficio que se percibe es el
# mismo y le queda más margen a algo que esté volcando datos a disco. El
# arranque se deja como viene: un servicio lento al encender que muere a los
# 15 segundos es un sistema que no arranca, y eso es peor que esperar.
[Manager]
DefaultTimeoutStopSec=20s
