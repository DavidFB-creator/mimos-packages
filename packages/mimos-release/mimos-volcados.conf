# Los volcados de memoria se conservan tres días y luego se van.
#
# Queremos que existan: ADR-121 -- la bandeja del actualizador que abortaba en
# cualquier sesión de KDE -- se diagnosticó leyendo uno. Lo que no queremos es
# que se acumulen para siempre; un solo volcado de un navegador son cientos
# de megas.
e /var/lib/systemd/coredump - - - 3d
