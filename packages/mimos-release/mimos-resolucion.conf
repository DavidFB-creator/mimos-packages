# MimOS: LLMNR fuera, y el mDNS tiene un solo dueño — avahi.
#
# LLMNR se apaga (ADR-137): es resolución de nombres de la era de Windows,
# en un escritorio Linux con DNS que funciona no aporta nada, y su
# envenenamiento es un ataque de red local de manual. Encontrado midiendo:
# la primera pasada de seguridad vio a resolved contestando en el 5355 en
# todas las interfaces de un sistema recién instalado.
#
# El mDNS se queda — es como se encuentran las impresoras y otros equipos de
# la red local — pero desde ADR-140 lo anuncia avahi, no resolved. cups
# exige avahi como dependencia dura, así que en cuanto MimOS imprime de
# verdad hay un demonio mDNS de pleno derecho en el sistema, y dos
# anunciantes del mismo nombre en el mismo puerto es uno de más. Medido en
# el disco instalado: los dos conviven atados al 5353 sin pelearse por el
# socket, pero con los dos anunciando la respuesta llega por duplicado.
# Quien pregunta por .local a través de resolved sigue teniendo respuesta:
# el laboratorio midió getent y resolvectl resolviendo el hostname con
# avahi al mando.
#
# Va en /usr/lib, como los demás ajustes de MimOS, para que quien no esté
# de acuerdo lo cambie en /etc sin pelearse con el paquete.

[Resolve]
LLMNR=no
MulticastDNS=no
