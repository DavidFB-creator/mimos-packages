# Intercambio comprimido en RAM en lugar de en disco.
#
# Es lo que hace que un portátil viejo con 4 GB siga siendo usable: en vez
# de escribir páginas al disco -- lento, y en un SSD desgaste -- se comprimen
# con zstd y se quedan en memoria. En la práctica multiplica la RAM útil.
#
# `zram-size = ram` reserva como mucho el tamaño de la RAM, no lo ocupa: zram
# solo consume lo que realmente guarda. La prioridad 100 la pone por delante
# de cualquier partición de intercambio en disco, que es el orden que tiene
# sentido.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
