# Keep the splash on screen until something else draws (ADR-154).
#
# Stock `plymouth quit` hands the framebuffer back to the console -- and the
# console still holds GRUB's last frame, because nothing between the boot menu
# and here has cleared it. So the screen David sees while SDDM starts, again
# when he logs out, and again when he shuts down, is literally the same pixels
# GRUB wrote at power-on, hours earlier. Measured on his laptop on 2026-08-22:
# plymouth-quit finishes at 8.699s and SDDM starts at 8.702s, and the gap is
# the console.
#
# `--retain-splash` leaves the splash image in place instead of restoring the
# console, so the last thing on screen is MIMI until the greeter paints over
# it. The empty ExecStart= is required: without it systemd appends rather than
# replaces.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
