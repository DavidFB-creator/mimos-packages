# Live-session login, and nothing else.
#
# Everything in this file is removed by a real installation, because a target
# must never inherit a passwordless automatic login. That makes it the wrong
# home for any setting the installed system should keep: DisplayServer=wayland
# used to be here and went with the autologin, leaving the installed greeter on
# Arch's X11 default. It now lives in mimos-branding's 20-mimos-theme.conf,
# which survives installation.
[Autologin]
User=mimos
Session=plasma
Relogin=false
