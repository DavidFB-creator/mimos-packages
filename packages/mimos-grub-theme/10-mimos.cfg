# MimOS boot menu and boot messages.
#
# A file of our own rather than an edit of /etc/default/grub. grub-mkconfig
# sources the main file and then every /etc/default/grub.d/*.cfg -- measured in
# grub 2:2.14-1, lines 161 and 163-167, each drop-in guarded by `test -f` -- so
# everything here wins over the main file without any package having to append
# to, migrate, or clean up a file it does not own. pacman verifies it like any
# other packaged file, and removing the package removes the settings.
#
# This is sourced as shell, which is why the locale block below is allowed to
# be logic rather than assignments.

GRUB_THEME="/usr/share/grub/themes/mimos/theme.txt"

# Without a graphics mode GRUB may pick a text mode, and in text mode a
# graphical theme is not drawn at all: the machine shows the stock menu and
# nothing looks broken enough to investigate.
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep

# The ground GRUB's console draws on once the menu is gone, while the kernel
# and the initramfs are read. Without it that screen is a black rectangle --
# measured, and photographed on David's laptop on 2026-08-10.
#
# It is the SAME file the menu uses, which is the point: the menu and the
# screen that follows it are one continuous surface rather than two that
# happen to look similar. It carries no mark, because 00_header stretches
# whatever is bound here to the panel and a stretched logo is a wrong logo
# (ADR-076) -- which is also why the menu itself no longer has one.
# GRUB_BACKGROUND is deliberately NOT set here, and this comment is the
# reason. 00_header is an if/elif: with a theme set it writes `set theme=`
# and never reaches the background branch, so the value would be read by
# nobody. It was set here for a whole release and did exactly nothing --
# measured on a real installation, where `background_image` appeared zero
# times in a generated grub.cfg. See ADR-133.
#
# And since ADR-157 nothing binds one at all: the screen between the menu and
# the kernel is deliberately black, because Windows' boot manager draws only
# its spinner over whatever is already there. A generator at
# /etc/grub.d/09-mimos-consola used to emit the background line and has been
# withdrawn; if you find one on a machine, it is left over from a version
# before 0.9.0-beta.4 and pacman removes it on upgrade.

# --- the two lines GRUB prints after somebody chooses an entry --------------
#
# Stock they read "Loading Linux linux ..." and "Loading initial ramdisk ...".
# The stutter is not a defect anybody introduced: GRUB prints "Loading Linux
# <version>", and on Arch the kernel package is called `linux`. CachyOS avoids
# it only because theirs is called linux-cachyos -- their own 10_linux patch is
# about deriving that name, and it does not silence anything. They print the
# same message we do.
#
# Three ways of getting rid of the text were measured and all three failed: a
# GRUB function named `echo` does not shadow the builtin, a console pushed off
# the screen gets recentred rather than clipped, and Arch ships GRUB unpatched
# so there is no `quiet` guard to set. What is left is to change the message,
# and that can be done without patching anything: the message goes through
# gettext, so a catalogue of our own under a locale name GRUB does not own
# replaces it. Untranslated strings fall through to the real Spanish catalogue,
# which is why LANGUAGE lists ours first and the system's second.
if [ -r /etc/locale.conf ]; then
  . /etc/locale.conf
fi
if [ -n "${LANG}" ]; then
  # es_ES.UTF-8 -> es. The catalogue is per language, not per territory: a
  # Mexican and a Spaniard get the same boot message.
  mimos_idioma="${LANG%%_*}"
  mimos_idioma="${mimos_idioma%%.*}"
  # Only claim the language if we actually ship it. A LANGUAGE pointing at a
  # catalogue that is not there would silently fall back, which is harmless --
  # but so is checking, and this way the condition says what it means.
  if [ -r "/usr/share/locale/${mimos_idioma}@mimos/LC_MESSAGES/grub.mo" ]; then
    # LC_ALL beats LANG and LANGUAGE both, and Calamares runs grub-mkconfig
    # with a sanitised C environment -- so for every MimOS ever installed the
    # catalogue below was reached by nobody and the boot said "Loading Linux
    # linux ..." in English. Measured in both directions on David's laptop on
    # 2026-08-22: grub-mkconfig plain emits «Cargando MimOS…», the same
    # command under `env LC_ALL=C` emits three English lines and zero Spanish
    # ones. ADR-125's mechanism was right and its environment was not, which
    # nothing could tell because the generating shell always had a locale.
    #
    # Unset rather than override, and localise ONLY messages: grub-mkconfig
    # parses the output of other commands, and a C collation and a C numeric
    # format are worth keeping exactly as whoever called us intended.
    unset LC_ALL
    export LC_MESSAGES="${LANG}"
    export LANG
    export LANGUAGE="${mimos_idioma}@mimos:${LANG}"
  fi
  unset mimos_idioma
fi

# The kernel's console cursor, which blinks on top of the boot background from
# the moment GRUB hands over until Plymouth draws -- visible in the photograph
# David took on 2026-08-22, bottom left of the boot screen.
#
# APPENDED, never assigned. This drop-in is sourced after /etc/default/grub,
# so the variable already holds whatever Calamares merged into it -- including
# the `cryptdevice=` of an encrypted install. ADR-095 assigned this variable
# from a package and produced a machine that could not mount its own root;
# appending is the same idea with the accident removed.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }vt.global_cursor_default=0"
