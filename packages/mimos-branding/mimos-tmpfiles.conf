# The greeter runs as user `sddm` with HOME=/var/lib/sddm, and its icon theme
# comes from that home's kdeglobals -- the same file KDE's own SDDM settings
# module writes. Shipping the file as a package path would put a root-owned
# directory tree inside a home the `sddm` package owns as sddm:sddm 0750, and
# pacman does not reconcile directory ownership between packages. tmpfiles
# copies the packaged source at boot only when no file exists yet, so a
# system where sddm-kcm has written real settings is never overwritten.
d /var/lib/sddm/.config 0750 sddm sddm -
C /var/lib/sddm/.config/kdeglobals 0644 sddm sddm - /usr/share/mimos/branding/sddm-kdeglobals
z /var/lib/sddm/.config/kdeglobals 0644 sddm sddm -
