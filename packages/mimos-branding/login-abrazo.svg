<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    Login background B - "Abrazo".

    Two arms cradling the login card, drawn as round-capped strokes that rise
    rather than cut across. The diagonal sweeps this replaces read as speed;
    an embrace is slow, so the curves ease outward and the caps are round.

    Everything lives outside x 576-1344, which is where check-login-contrast.py
    says Breeze puts the clock, the card, the name and the power buttons. The
    centre is empty on purpose.
  -->
  <defs>
    <linearGradient id="ground" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#33243E"/>
      <stop offset="0.58" stop-color="#2A1D33"/>
      <stop offset="1" stop-color="#211724"/>
    </linearGradient>
    <linearGradient id="armL" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#FF6FAE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF6FAE" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="armR" x1="1" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#FF6FAE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF6FAE" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#FF6FAE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF6FAE" stop-opacity="0"/>
    </radialGradient>
    <path id="c" d="M0 0c-22-20-58-52-58-80 0-24 18-38 34-38 12 0 20 9 24 19 4-10 12-19 24-19 16 0 34 14 34 38 0 28-36 60-58 80z"/>
  </defs>

  <rect width="1920" height="1080" fill="url(#ground)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>

  <!-- The arms. Round caps and a slow ease; nothing crosses the centre band. -->
  <g fill="none" stroke-linecap="round" stroke-width="112">
    <path d="M-90 1010C170 940 400 760 468 396" stroke="url(#armL)"/>
    <path d="M2010 1010c-260-70-490-250-558-614" stroke="url(#armR)"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="26" opacity="0.5">
    <path d="M-70 830C140 770 300 620 352 340" stroke="#FF6FAE" stroke-opacity="0.20"/>
    <path d="M1990 830c-210-60-370-210-422-490" stroke="#FF6FAE" stroke-opacity="0.20"/>
  </g>

  <!-- Where each arm ends, a heart, as if it were the hand. -->
  <g fill="#FF6FAE" opacity="0.26">
    <use href="#c" transform="translate(468 372) scale(1.05)"/>
    <use href="#c" transform="translate(1452 372) scale(1.05)"/>
  </g>

  <!-- Drifting away from the hands, smaller and fainter. -->
  <g fill="#FF6FAE" opacity="0.13">
    <use href="#c" transform="translate(268 236) scale(0.52)"/>
    <use href="#c" transform="translate(1676 300) scale(0.46)"/>
    <use href="#c" transform="translate(150 508) scale(0.34)"/>
    <use href="#c" transform="translate(1820 560) scale(0.30)"/>
    <use href="#c" transform="translate(392 116) scale(0.28)"/>
    <use href="#c" transform="translate(1552 132) scale(0.33)"/>
  </g>
</svg>
