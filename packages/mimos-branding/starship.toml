# The MimOS prompt.
# Generated by scripts/generate-terminal-theme.py from
# packages/mimos-branding/palette.json. Do not edit by hand;
# edit the palette and regenerate, or make check will fail.

# Two lines: everything you might want to read on the first, an empty
# place to type on the second. Long paths and long branch names then never
# push the cursor around.
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #FF6FAE)"
error_symbol = "[❯](bold #FF9AB4)"

[directory]
style = "bold #B3A2FF"
truncation_length = 3
truncate_to_repo = true

# The branch glyph is a Nerd Font private-use codepoint. It drew as a tofu
# box on a system that had only ttf-nerd-fonts-symbols installed -- measured,
# not assumed, and the same shape as ADR-047: a glyph the terminal's font
# cannot supply renders as a box, not as nothing. It is here because the
# image now ships JetBrains Mono Nerd and the terminal asks for it by name,
# which is the other half of that lesson.
[git_branch]
symbol = " "
style = "#70D6C5"

[git_status]
style = "#F1D58A"

# Only when something took long enough that you walked away from it.
[cmd_duration]
min_time = 2000
style = "#F1D58A"
format = "took [$duration]($style) "
