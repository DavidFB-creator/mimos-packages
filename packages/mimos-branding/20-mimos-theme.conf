# MimOS login-screen configuration.
#
# Owned by mimos-branding, which survives installation, so the installed
# system keeps these settings. This is deliberately separate from
# /etc/sddm.conf.d/10-mimos.conf, which mimos-live-environment owns and which
# a real installation removes together with the passwordless Live session.
#
# That separation is the whole point of this file, and it was only half
# applied: DisplayServer=wayland lived in the Live file, so a target that
# correctly deleted the autologin also lost the display server and fell back to
# Arch's default of X11. Measured on a running installed system, whose only
# display-manager processes were /usr/bin/sddm and /usr/lib/Xorg. A setting
# that must be removed and a setting that must persist do not belong in one
# file.
[Theme]
Current=breeze

# MimOS is a Wayland system and its login screen is part of it. SDDM 0.21 runs
# its Qt 6 greeter natively on Wayland; Arch leaves the upstream X11 default in
# place, which is why this has to be stated rather than assumed.
[General]
DisplayServer=wayland
# The greeter is a Qt application drawn by a compositor, and it needs the
# layer-shell integration to place itself. Without this it is a plain window
# with nothing to put it on the screen.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

# Naming the compositor is not optional, and this is the line that makes the
# setting above safe rather than catastrophic.
#
# SDDM's shipped default is `CompositorCommand=weston --shell=kiosk`, and
# **weston is not in this image** -- checked in the composed squashfs, where
# /usr/bin/kwin_wayland exists and /usr/bin/weston does not. A Wayland greeter
# with no compositor draws nothing, which on the login screen means nobody can
# get in.
#
# The Live session never exposed this: it autologins, so SDDM has been running
# with DisplayServer=wayland for releases without ever drawing a greeter. The
# first system to draw one would have been an installed one, belonging to
# somebody else.
[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
