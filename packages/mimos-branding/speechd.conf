# MimOS speech-dispatcher default.
#
# The image sets LANG=es_ES.UTF-8 and ships Orca, and espeak-ng carries a
# Spanish_(Spain) voice -- but nothing connected the three, so the synthesiser
# fell back to its English default and read Spanish interface text with an
# English accent. Measured by a person listening to the installer, which is the
# only instrument that could have caught it: an accessibility inventory can
# report that names exist and never notice what language they are spoken in.
#
# This is a default, not a policy. It lands in a new user's home through
# /etc/skel, so anyone can change it in their own configuration without
# fighting a system file.

DefaultLanguage "es"
DefaultVoiceType "MALE1"
