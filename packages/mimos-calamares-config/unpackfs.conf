---
# The source is the mounted read-only image, not a file at a fixed path.
#
# This used to name /run/archiso/bootmnt/mimos/x86_64/airootfs.sfs. On the first
# physical machine MimOS ran on, booted from a Ventoy USB, that path did not
# exist: archiso had copied the image into RAM and released the boot medium, so
# the squashfs was under /run/archiso/copytoram. The installer's own launcher
# refused to start for the same reason, and had it started, the installation
# would have failed here instead -- later, and after touching the disk.
#
# /run/archiso/airootfs is the read-only squashfs mount that the running system
# is built from, and it exists whichever way the machine was booted. It is the
# same bytes: the Live overlay is combined on top of this mount, not into it.
#
# sourcefs "file" tells unpackfs the source is already a directory, so it copies
# with rsync instead of mounting a loop device. rsync 3.4.4 is in the image.
unpack:
  - source: /run/archiso/airootfs
    sourcefs: file
    destination: ''
    weight: 1
