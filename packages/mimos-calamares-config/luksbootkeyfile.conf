---
# Creates /crypto_keyfile.bin on the encrypted target and adds it to a LUKS
# keyslot. With /boot inside the encrypted root, GRUB already asked for the
# passphrase once to read the kernel; the keyfile is what stops the initramfs
# from asking for the same passphrase a second time. It never leaves the
# encrypted filesystem, so it is only readable once the disk is already open.
#
# Sequenced before fstab and initcpiocfg on purpose: both check whether the
# file exists and silently do less when it does not. See ADR-088.
#
# "default" defers the key-derivation function to cryptsetup, which on Arch
# answers argon2id for LUKS2.
luks2Hash: default
