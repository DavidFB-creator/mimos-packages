---
useSystemdHook: false
hooks:
  prepend: []
  # grub-btrfs-overlayfs is what makes a snapshot bootable. A btrfs snapshot
  # is read-only, and a read-only root does not reach a usable desktop -- so
  # without this hook the GRUB snapshot entries would exist and lead nowhere.
  # It lays a tmpfs overlay over the read-only root at late hook time.
  #
  # Two things were measured rather than assumed. First, `append` really is
  # applied last: initcpiocfg's main.py builds the list and only then does
  # `hooks_prepend + hooks + hooks_append`, so this lands after `filesystems`,
  # after `encrypt` and after `fsck`, which is the only position where it can
  # see the mounted root. Second, the hook is inert on a normal boot: it runs
  # its overlay only when `btrfs property get /new_root ro` is not `ro=false`,
  # so an ordinary installation is untouched by it. See ADR-102.
  append:
    - grub-btrfs-overlayfs
  remove:
    - archiso
    - archiso_loop_mnt
    - archiso_pxe_common
    - archiso_pxe_nbd
    - archiso_pxe_http
    - archiso_pxe_nfs
source: /etc/mkinitcpio.conf
