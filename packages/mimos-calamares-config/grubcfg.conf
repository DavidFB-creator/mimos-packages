---
# Writes /etc/default/grub on the target before grub-mkconfig reads it.
#
# This module is what makes an encrypted target bootable: when the root
# partition carries a LUKS mapper it appends cryptdevice=UUID=<luksUuid>:<name>
# and root=/dev/mapper/<name> to GRUB_CMDLINE_LINUX_DEFAULT, and sets
# GRUB_ENABLE_CRYPTODISK=y whenever there is no unencrypted separate /boot --
# which is our layout, because /boot lives inside the root filesystem and only
# the ESP sits outside. Both behaviours were read from the 3.4.2 module source,
# not assumed. Without this module the encrypted installation completes and the
# resulting disk cannot boot. See ADR-088.
#
# On an unencrypted target it still runs: it merges the existing
# GRUB_CMDLINE_LINUX_DEFAULT parameters with kernel_params below and rewrites
# the file in place. The non-encrypted scenarios therefore gate the installed
# GRUB entries too.

# Edit the existing file rather than replacing it. mimos-release appends a
# marker-delimited block with GRUB_DISABLE_OS_PROBER and GRUB_DISTRIBUTOR, and
# an overwrite would discard it.
overwrite: false

# Keep the GRUB_DISTRIBUTOR already present in the file. mimos-release owns
# that value (ADR-075: the installed menu read "Arch Linux" until it did), and
# grubcfg reads the file's last occurrence -- the MimOS block's -- and writes
# it back. Without this flag the module would substitute the branding entry
# name, moving ownership of the menu title to a second place.
keep_distributor: true

# Matches the parameters the unencrypted installations have booted with.
kernel_params: [ "quiet" ]
