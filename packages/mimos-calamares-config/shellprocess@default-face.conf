---
# Runs inside the target, after `users`, because the face file is named after
# the account and the account has to exist first. The helper ships in
# mimos-branding, which unpackfs has already copied into the target, and it
# exits 0 when there is nothing to do, so an unusual target cannot abort an
# installation over an avatar.
dontChroot: false
timeout: 30
verbose: true

script:
  - "/usr/bin/mimos-install-default-face"

i18n:
  name: "Setting the login picture"
  name[es]: "Poniendo la cara de MIMI"
