---
displaymanagers:
  - sddm
basicSetup: false
sysconfigSetup: false
defaultDesktopEnvironment:
  executable: /usr/bin/startplasma-wayland
  desktopFile: plasma
sddm:
  configuration_file: /etc/sddm.conf
  # Breeze, branded through its own theme.conf.user rather than replaced.
  # See ADR-079: a broken SDDM theme means nobody can log in.
  theme: breeze
