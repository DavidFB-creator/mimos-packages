---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
  # Snapshots live in their own subvolume, outside /@, so that a snapshot of
  # /@ does not contain the snapshots themselves -- btrfs does not recurse
  # into nested subvolumes, but a nested layout still makes /@ impossible to
  # replace wholesale, which is exactly what restoring does. Creating it here
  # also means snapper never has to: `snapper create-config` would refuse a
  # /.snapshots that already exists, so mimos-configure-snapshots writes the
  # configuration from snapper's own shipped template instead. See ADR-102.
  - mountPoint: /.snapshots
    subvolume: /@snapshots

btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, 'umask=0077' ]
  - filesystem: btrfs
    options: [ defaults, 'compress=zstd:1', noatime ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
