---
# Runs inside the target after `packages`. The helper ships in mimos-release,
# which unpackfs has already copied into the target, and /sys inside the
# chroot is the real machine's, so the hardware question is answered about
# the computer being installed. On a machine with Broadcom wireless it keeps
# the driver and says so; anywhere else it removes the blob whose class-wide
# PCI alias would load it at every boot and taint the kernel (ADR-097).
dontChroot: false
timeout: 60
verbose: true

script:
  - "/usr/lib/mimos/mimos-remove-unneeded-broadcom-wl"

i18n:
  name: "Tidying wireless drivers"
  name[es]: "Ajustando los controladores inalámbricos"
