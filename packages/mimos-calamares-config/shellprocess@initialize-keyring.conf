---
# Run only inside the freshly unpacked target. Archiso initializes pacman's
# runtime keyring in the Live overlay, which unpackfs deliberately does not
# copy. A target-local master key and both public distribution keyrings must
# exist before the installed machine can refresh signed repositories.
dontChroot: false
# Per command, not for the list. `pacman-key --populate archlinux mimos`
# imports around 183 keys and rebuilds the trust database, which the Live
# image measures in tens of seconds on a fast machine with an SSD. A slow
# disk is exactly the hardware this correction exists to serve, and the
# failure mode is not a slow install but an aborted one, near the end, after
# the target has been written. The user watches a progress bar, not a
# countdown, so a high ceiling costs nothing and a low one costs the
# installation.
timeout: 600
verbose: true

script:
  - "/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "/usr/bin/install -d -m755 /etc/pacman.d/gnupg"
  - "/usr/bin/pacman-key --init"
  - "/usr/bin/pacman-key --populate archlinux mimos"

i18n:
  name: "Preparing package verification"
  name[es]: "Preparando la verificación de paquetes"
