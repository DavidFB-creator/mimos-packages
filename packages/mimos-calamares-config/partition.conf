---
efi:
  mountPoint: /boot/efi
  recommendedSize: 1GiB
  minimumSize: 512MiB
  label: EFI

userSwapChoices:
  - none
  - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Manual partitioning and LUKS are deliberately disabled. Neither path has
# passed a disposable-VM acceptance scenario, and the LUKS sequence is
# structurally incomplete: settings.conf declares no luksbootkeyfile or
# luksopenswaphookcfg module and initcpiocfg.conf appends no encrypt hook, so
# an encrypted target would produce an initramfs that cannot open its root
# device. Re-enabling either option requires its own passing scenario and a
# superseding decision record. See ADR-029 and ADR-030.
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false

initialPartitioningChoice: none
initialSwapChoice: file
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
essentialMounts: [ 'live-*', control, ventoy ]
preCheckEncryption: false
lvm:
  enable: false
requiredStorage: 16
