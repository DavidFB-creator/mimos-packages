---
efi:
  mountPoint: /boot/efi
  recommendedSize: 1GiB
  minimumSize: 512MiB
  label: EFI

userSwapChoices:
  - none
  - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Manual partitioning is enabled by ADR-090, superseding ADR-030 under the
# condition ADR-030 set: it now has its own acceptance scenario,
# test-installer-manual, which installs into a pre-partitioned disk and
# asserts three different fates on one disk -- the existing ESP reused
# without formatting, the chosen root formatted, and an unnamed neighbour
# partition byte-identical afterwards. No image carrying this may be
# published before that scenario passes against its exact composed bytes.
allowManualPartitioning: true
# LUKS automated partitioning is enabled by ADR-088, superseding ADR-029.
# The structural gaps ADR-029 named are closed differently
# from how its checklist imagined: the encrypt hook is inserted by the 3.4.2
# initcpiocfg module itself (before "filesystems", where appending it here
# would misplace it), the keyfile comes from luksbootkeyfile in the sequence,
# grubcfg writes cryptdevice= and GRUB_ENABLE_CRYPTODISK, and
# luksopenswaphookcfg is unnecessary because initialSwapChoice is a swap file,
# not an encrypted swap partition. The encrypted-install scenario is the
# acceptance evidence.
enableLuksAutomatedPartitioning: true
# LUKS2. LUKS1's default key derivation is PBKDF2; cryptsetup's LUKS2 default
# is argon2id.
luksGeneration: luks2

initialPartitioningChoice: none
initialSwapChoice: file
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
essentialMounts: [ 'live-*', control, ventoy ]
preCheckEncryption: false
lvm:
  enable: false
requiredStorage: 16
