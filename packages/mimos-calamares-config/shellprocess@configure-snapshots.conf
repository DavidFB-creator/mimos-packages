---
# Runs inside the target after `services-systemd` and before `grubcfg`.
#
# The position is the whole design. After `users` and `services-systemd`, so
# the first snapshot contains the account the person just created and the
# services that make the system boot -- a snapshot taken any earlier would
# restore a machine with no way to log into it. Before `grubcfg` and
# `bootloader`, so grub-mkconfig runs with the snapshot already on disk and
# the installed menu offers it from the very first boot.
#
# The helper ships in mimos-release, which unpackfs has already copied into
# the target. See ADR-102.
dontChroot: false
timeout: 120
verbose: true

script:
  - "/usr/lib/mimos/mimos-configure-snapshots"

i18n:
  name: "Preparing snapshots"
  name[es]: "Preparando las instantáneas"
