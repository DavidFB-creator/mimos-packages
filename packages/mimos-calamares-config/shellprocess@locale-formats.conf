---
# Runs inside the target right after `localecfg`, which wrote
# /etc/locale.conf and generated the locales in it. The helper ships in
# mimos-release, which unpackfs has already copied into the target, and it
# exits 0 whenever there is nothing to do, so an unusual target cannot abort
# an installation over a date format. See ADR-159.
dontChroot: false
timeout: 30
verbose: true

script:
  - "/usr/lib/mimos/mimos-install-locale-formats"

i18n:
  name: "Choosing the formats"
  name[es]: "Eligiendo los formatos"
  name[ca]: "Triant els formats"
