---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: true
    system: true
  - audio
  - video
  - storage
  - optical

sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 64
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
    - usersubstr=4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, mimos ]
  home_permissions: o700

hostname:
  location: EtcFile
  writeHostsFile: true
  template: 'mimos-${first}'
  forbidden_names: [ localhost ]

allowActiveDirectory: false
presets:
  fullName:
    editable: true
  loginName:
    editable: true
