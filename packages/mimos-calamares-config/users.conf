---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: true
    system: true
  - audio
  - video
  - storage
  - optical

sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 64
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
    - usersubstr=4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  # zsh. Two files reach the new account from /etc/skel and both matter:
  # grml-zsh-config's own .zshrc, which is what stops zsh opening its
  # first-run wizard, and mimos-branding's .zshrc.local, which grml reads at
  # the very end and which carries everything MimOS puts in the shell. The
  # shell must also exist in the target or the account cannot log in at all,
  # so the package list and this line are two halves of one decision.
  # See ADR-099 and ADR-113.
  shell: /bin/zsh
  forbidden_names: [ root, mimos ]
  home_permissions: o700

hostname:
  location: EtcFile
  writeHostsFile: true
  template: 'mimos-${first}'
  forbidden_names: [ localhost ]

allowActiveDirectory: false
presets:
  fullName:
    editable: true
  loginName:
    editable: true
