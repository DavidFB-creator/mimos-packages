---
# Runs inside the target, after `users` (the account's home must exist, with
# its skel copy of speechd.conf) and after `localecfg` (which wrote
# /etc/locale.conf). The helper ships in mimos-branding, which unpackfs has
# already copied into the target, and it exits 0 whenever there is nothing
# to do, so an unusual target cannot abort an installation over a voice.
# See ADR-159.
dontChroot: false
timeout: 30
verbose: true

script:
  - "/usr/bin/mimos-install-speech-language"

i18n:
  name: "Choosing the voice's language"
  name[es]: "Eligiendo el idioma de la voz"
  name[ca]: "Triant l'idioma de la veu"
