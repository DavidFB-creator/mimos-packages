---
modules-search: [ local ]

# A module@id entry in the sequence is a custom instance, and Calamares will
# not find its configuration unless the instance is declared here.
# Settings::InstanceDescription derives the file name from the module alone --
# `key.module() + ".conf"` -- so an undeclared shellprocess@initialize-keyring
# reads `shellprocess.conf`, a file this package does not ship, and the step
# silently does nothing while remaining visible in the sequence.
#
# That is exactly what happened: the first image carrying ADR-078 installed
# perfectly and its target keyring was never initialized. The installation
# succeeding proves nothing here, because a step that does nothing cannot fail.
instances:
  - id: initialize-keyring
    module: shellprocess
    config: shellprocess@initialize-keyring.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@initialize-keyring
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - packages
      - removeuser
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: mimos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
