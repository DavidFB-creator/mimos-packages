---
modules-search: [ local ]

# A module@id entry in the sequence is a custom instance, and Calamares will
# not find its configuration unless the instance is declared here.
# Settings::InstanceDescription derives the file name from the module alone --
# `key.module() + ".conf"` -- so an undeclared shellprocess@initialize-keyring
# reads `shellprocess.conf`, a file this package does not ship, and the step
# silently does nothing while remaining visible in the sequence.
#
# That is exactly what happened: the first image carrying ADR-078 installed
# perfectly and its target keyring was never initialized. The installation
# succeeding proves nothing here, because a step that does nothing cannot fail.
instances:
  - id: initialize-keyring
    module: shellprocess
    config: shellprocess@initialize-keyring.conf
  - id: default-face
    module: shellprocess
    config: shellprocess@default-face.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@initialize-keyring
      - machineid
      - locale
      - keyboard
      - localecfg
      # Before fstab, as upstream orders it: fstab writes /etc/crypttab and
      # only names /crypto_keyfile.bin if the file already exists on the
      # target, so a keyfile created after fstab would leave crypttab saying
      # "none". initcpiocfg has the same dependency -- it embeds the keyfile
      # into FILES only when it is already present. See ADR-088.
      - luksbootkeyfile
      - fstab
      - initcpiocfg
      - packages
      - removeuser
      - initcpio
      - users
      - shellprocess@default-face
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      # Before bootloader, because grub-mkconfig reads what grubcfg writes.
      # Without this module nothing puts cryptdevice= and root=/dev/mapper/...
      # on the kernel line or GRUB_ENABLE_CRYPTODISK in /etc/default/grub, so
      # an encrypted target would install cleanly and never boot. Measured in
      # the 3.4.2 grubcfg module, not assumed. See ADR-088.
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: mimos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
